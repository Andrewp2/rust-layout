[package]
name = "native_app"
default-run = "glassworks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["native"]
native = []
web = []

[lib]
name = "glassworks_studio"
path = "src/lib.rs"

[[bin]]
name = "glassworks"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
drc = { path = "../drc" }
geometry_core = { path = "../geometry_core" }
layout_model = { path = "../layout_model" }
operad.workspace = true
pollster.workspace = true
renderer = { path = "../renderer" }
router = { path = "../router" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flate2.workspace = true
operad = { workspace = true, features = ["native-window"] }
operad_wgpu = { package = "wgpu", version = "29.0.3", features = ["wgsl"] }
tracing-subscriber.workspace = true
winit = "0.30.13"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
