[workspace]
resolver = "3"
members = [
	"crates/geometry_core",
	"crates/layout_model",
	"crates/drc",
	"crates/router",
	"crates/renderer",
	"crates/native_app",
	"crates/sync_server",
	"crates/wasm_app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Andrew Peterson"]

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8.6", features = ["ws"] }
futures-util = "0.3"
glam = { version = "0.30.4", features = ["serde"] }
log = "0.4"
loro = "1.12.0"
operad = { git = "https://github.com/Andrewp2/Operad.git", rev = "eeee4153e9d5b261da337a06f0c23c5ae7b1bd52", features = [
	"widgets",
	"wgpu",
] }
pollster = "0.4"
rand = "0.9"
rstar = "0.12.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "net"] }
tokio-stream = "0.1"
tokio-tungstenite = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.18", features = ["serde", "v4", "js"] }
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
web-sys = "0.3.77"
web-time = "1.1"
wgpu = { version = "27.0.1", default-features = false, features = [
	"dx12",
	"gles",
	"metal",
	"parking_lot",
	"spirv",
	"std",
	"vulkan",
	"webgl",
	"webgpu",
	"wgsl",
] }

[profile.dev]
opt-level = 1
debug = 1
incremental = true
codegen-units = 256

[profile.dev.package."*"]
opt-level = 1

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.profiling]
inherits = "release"
debug = 2
strip = "none"
