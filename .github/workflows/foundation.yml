name: Foundation Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance-reports:
    name: Performance Budgets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run performance budget fixtures
        env:
          FABRICAD_PERFORMANCE_REPORT_DIR: ${{ github.workspace }}/target/performance-reports
        run: cargo test -p native_app performance --lib

      - name: Upload observed performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabricad-performance-reports
          path: ${{ github.workspace }}/target/performance-reports/*.json
          if-no-files-found: error

  web-render-smoke:
    name: Web Demo Render Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: cargo install trunk --locked --version 0.21.14

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true

      - name: Install Python screenshot dependencies
        run: python -m pip install pillow requests websocket-client

      - name: Run wasm regression tests
        run: cargo test -p wasm_app

      - name: Run web render smoke
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          FABRICAD_SKIP_SHADER_COMPILE: "1"
        run: ./scripts/render_e2e.py --skip-baseline

      - name: Upload render smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabricad-render-e2e
          path: ${{ github.workspace }}/target/render-e2e
          if-no-files-found: error
